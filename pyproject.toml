[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d4-visual-bot"
version = "0.1.0"
description = "External screen-vision combat/roam assistant for Diablo IV (experimental)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "mss>=9,<11",
  "PyYAML>=6,<7",
  "pydirectinput>=1.0.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
d4bot = "d4bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
